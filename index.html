<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | doodle</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Doodle">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Unity's own #unity-fullscreen-button calls its internal SetFullscreen JS, which
         Safari silently refuses unless the call chain is a direct, synchronous result of
         the click — going through Unity's managed/native bridge breaks that chain. This
         button instead calls the Fullscreen API straight from the DOM click handler below,
         with every vendor prefix Safari needs, so it actually works there. */
      #doodle-fullscreen-button {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 44px;
        height: 44px;
        z-index: 20;
        border: 2px solid #222;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.85);
        color: #222;
        font-size: 22px;
        line-height: 40px;
        text-align: center;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-build-title">doodle</div>
      </div>
    </div>
    <div id="doodle-fullscreen-button" title="Fullscreen">⛶</div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Real, direct Fullscreen API call with every vendor prefix in play (webkit covers
      // Safari) — fired synchronously inside the click handler itself, which is exactly
      // what browsers require to treat this as a genuine user gesture.
      function doodleToggleFullscreen() {
        var target = fullscreenContainer || document.documentElement;
        var current = document.fullscreenElement || document.webkitFullscreenElement ||
          document.mozFullScreenElement || document.msFullscreenElement;

        if (!current) {
          var request = target.requestFullscreen || target.webkitRequestFullscreen ||
            target.mozRequestFullScreen || target.msRequestFullscreen;
          if (request) request.call(target);
        } else {
          var exit = document.exitFullscreen || document.webkitExitFullscreen ||
            document.mozCancelFullScreen || document.msExitFullscreen;
          if (exit) exit.call(document);
        }
      }
      document.querySelector("#doodle-fullscreen-button").addEventListener("click", doodleToggleFullscreen);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/web.data",
        frameworkUrl: buildUrl + "/web.framework.js",
        codeUrl: buildUrl + "/web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "GD",
        productName: "doodle",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";


      } else {
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("service-worker.js");
        });
      }
    </script>
  </body>
</html>
